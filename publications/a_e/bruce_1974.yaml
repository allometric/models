publication:
  key: bruce_1974
  bibtype: techreport
  title: Volume equations for second-growth Douglas-fir
  author: Bruce, David and DeMars, Donald J
  year: 1974
models:
- name: vsia
  type: fixed_effects
  taxa:
  - family: Pinaceae
    genus: Pseudotsuga
    species: menziesii
  response: {vsia: ft3}
  covariates: {hst: ft, dsob: in}
  parameters: {a: 0.406098, b: 0.0762998, c: 0.00262615, d: 0.005454154}
  descriptors: {hst: <= 18 ft hst}
  prediction_function: fos <- a * (hst - 0.9)^2/(hst - 4.5)^2 - b * dsob * (hst - 0.9)^3/(hst - 4.5)^3 + c * dsob * hst * (hst - 0.9)^3/(hst - 4.5)^3; d * fos * (dsob^2 * hst)
- name: vsia_2
  type: fixed_effects
  taxa:
  - family: Pinaceae
    genus: Pseudotsuga
    species: menziesii
  response: {vsia: ft3}
  covariates: {hst: ft, dsob: in}
  parameters: {a: 0.480961, b: 42.46542, c: 10.99643, d: 0.107809, e: 0.00409083, f: 0.005454154}
  descriptors: {hst: '> 18 ft hst'}
  prediction_function: fol <- a + b/hst^2 - c * dsob/hst^2 - d * dsob/hst - e * dsob; f * fol * (dsob^2 * hst)
