publication:
  key: bluhm_2007
  bibtype: techreport
  title: Taper equation and volume tables for plantation-grown red alder
  author: Bluhm, Andrew A and Garber, Sean M and Hibbs, David E
  year: 2007
models:
- name: dsih
  type: fixed_effects
  taxa:
  - family: Betulaceae
    genus: Alnus
    species: rubra
  response: {dsih: in}
  covariates: {dsob: in, hst: ft, hsd: in, rc: ft ft-1}
  parameters: {a_1: 0.9113, a_2: 1.016, a_3: 0.2623, a_4: -18.7695, a_5: 3.1931, a_6: 0.1631, a_7: 0.418}
  prediction_function: z <- hsd/hst; p <- 4.5/hst; x <- (1 - sqrt(z))/(1 - sqrt(p)); a_1 * dsob^a_2 * x^(a_3 * (1.364409 * dsob^(1/3) * exp(a_4 * z) + exp(a_5 * rc^a_6 * (dsob/hst)^a_7 * z)))
