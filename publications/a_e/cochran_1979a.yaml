publication:
  key: cochran_1979a
  bibtype: techreport
  title: Site index and height growth curves for managed, even-aged stands of white or grand fir east of the Cascades in Oregon and Washington
  author: Cochran, PH
  year: 1979
models:
- name: hstix50
  type: fixed_effects_set
  taxa:
  - family: Pinaceae
    genus: Abies
    species: concolor
  - family: Pinaceae
    genus: Abies
    species: grandis
  response: {hstix50: ft}
  covariates: {hst: ft, atb: years}
  prediction_function: log_atb <- log(atb); x1 <- a + b * log_atb + c * log_atb^2 + d * log_atb^9 + e * log_atb; x2 <- f + g * log_atb + h * log_atb^4 + i * log_atb^9 + j * log_atb^11 + k * log_atb^18; (hst - 4.5) * exp(x1) - exp(x1) * exp(x2) + 89.43
  specifications:
  - {parameters: {a: 3.886, b: -1.8017, c: 0.2105, d: -2.885e-07, e: 1.187e-18, f: -0.30935, g: 1.2383, h: 0.001762, i: -5.4e-06, j: 2.046e-07, k: -4.04e-13}}
