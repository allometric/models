publication:
  key: cochran_1979b
  bibtype: techreport
  title: Site index and height growth curves for managed, even-aged stands of Douglas-fir east of the Cascades in Oregon and Washington
  author: Cochran, PH
  year: 1979
models:
- name: hstix50
  type: fixed_effects
  taxa:
  - family: Pinaceae
    genus: Pseudotsuga
    species: menziesii
  response: {hstix50: ft}
  covariates: {hst: ft, atb: years}
  parameters: {a: 84.47, b: -0.37496, c: 1.36164, d: -0.00243434, e: 0.52032, f: -0.0013194, g: 27.2823}
  prediction_function: a - (exp(b + c * log(atb) + d * log(atb)^4)) * (e + f * atb + g/atb) + (hst - 4.5) * (e + f * atb + g/atb)
