publication:
  key: curtis_1990
  bibtype: techreport
  title: Height growth and site index curves for western white pine in the Cascade Range of Washington and Oregon
  author: Curtis, Robert O and Diaz, Nancy M and Clendenen, Gary W
  year: 1990
models:
- name: hstix50
  type: fixed_effects
  taxa:
  - family: Pinaceae
    genus: Pinus
    species: monticola
  response: {hstix50: ft}
  covariates: {hst: ft, atb: years}
  parameters: {a: -2.608801, b: -0.715601, c: 0.408404, d: 0.138199}
  prediction_function: log_50 <- log(50); log_atb <- log(atb); exp(a * (log_atb - log_50) + b * (log_atb - log_50)^2) * hst^(1 + c * (log_atb - log_50) + d * (log_atb - log_50)^2)
