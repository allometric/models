publication:
  key: chojnacky_1985
  bibtype: techreport
  title: Pinyon-juniper volume equations for the central Rocky Mountain States
  author: Chojnacky, David C
  year: 1985
  descriptors:
    country: US
  volume: 339
  institution: "US Department of Agriculture, Forest Service"
models: []
model_sets:
- name: vsoa
  type: fixed_effects_set
  response: {vsoa: ft3}
  covariates: {dsoc: in, hst: ft}
  prediction_function: (a + b * (dsoc^2 * hst)^(1/3))^3
  specifications:
