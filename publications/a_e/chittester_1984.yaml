publication:
  key: chittester_1984
  bibtype: techreport
  title: Cubic-foot tree volume equations and tables for western juniper
  author: Chittester, Judith M and MacLean, Colin D
  year: 1984
  descriptors:
    country: US
    region: [US-OR, US-CA]
  institution: "US Department of Agriculture, Forest Service, Pacific Northwest Forest and Range Experiment Station (USA)"
  doi: "https://doi.org/10.2737/PNW-RN-420"
models:
- name: vsia
  type: fixed_effects
  taxa:
  - family: Cupressaceae
    genus: Juniperus
    species: occidentalis
  response: {vsia: ft3}
  covariates: {dsob: in, hst: ft}
  parameters: {a: 0.307, b: 0.00086, c: -0.0037}
  prediction_function: f <- a + b * hst + c * dsob * hst/(hst - 4.5); ba <- 0.005454154 * dsob^2; ba * f * hst * (hst/(hst - 4.5))^2
- name: vsim
  type: fixed_effects
  taxa:
  - family: Cupressaceae
    genus: Juniperus
    species: occidentalis
  response: {vsim: ft3}
  covariates: {vsoa: ft3, dsob: in}
  parameters: {a: 3.48, b: 1.18052, c: 0.32736, d: 2.948}
  prediction_function: (vsoa + a)/(b + c * exp(-0.1 * dsob)) - d
