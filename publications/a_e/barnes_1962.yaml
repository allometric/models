publication:
  key: barnes_1962
  bibtype: techreport
  title: Yield of even-aged stands of western hemlock
  author: Barnes, George H
  year: 1962
  descriptors:
    country: US
    region: [US-OR, US-WA]
  number: 1273
  url: "https://hdl.handle.net/2027/uva.x030348655"
  institution: "Department of Agriculture, Forest Service"
models:
- name: hstix50
  type: fixed_effects
  taxa:
  - family: Pinaceae
    genus: Tsuga
    species: heterophylla
  response: {hstix50: ft}
  covariates: {atb: year, hst: ft}
  parameters: {a: 22.6, b: 0.014482, c: 0.001162}
  descriptors: {age_class: '> 120'}
  description: "Table 1 eq. 5b. Western hemlock site index at breast-height age 50; site trees older than 120 years."
  prediction_function: 4.5 + a * exp((b - c * log(atb)) * (hst - 4.5))
