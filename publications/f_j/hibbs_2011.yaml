publication:
  key: hibbs_2011
  bibtype: article
  title: Stem taper and volume of managed red alder
  author: Hibbs, David and Bluhm, Andrew and Garber, Sean
  year: 2007
models:
- name: dsih
  type: fixed_effects
  response: {dsih: in}
  covariates: {dsob: in, hst: ft, hsd: in}
  parameters: {a_1: 0.8995, a_2: 1.0205, a_3: 0.2631, a_4: -18.899, a_5: 4.2549, a_6: 0.6221}
  equation: z <- hsd/hst; p <- hst/4.5; x <- (1 - sqrt(z))/(1 - sqrt(p)); a_1 * dsob^a_2 * x^(a_3 * (1.364409 * dsob^(1/3) * exp(a_4 * z) + exp(a_5 * (dsob/hst)^a_6 * z)))
