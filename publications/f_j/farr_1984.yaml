publication:
  key: farr_1984
  bibtype: techreport
  title: Site index and height growth curves for unmanaged even-aged stands of western hemlock and Sitka spruce in southeast Alaska.
  author: Farr, Wilbur
  year: 1984
models:
- name: hstix50
  type: fixed_effects
  response: {hstix50: ft}
  covariates: {hst: ft, atb: years}
  parameters: {a: 90.93, b: 6.396816, c: -4.098921, d: 0.7628741, e: -0.00244688, f: 2.445811e-07, g: -2.022153e-22, h: -0.2050542, i: 1.449615, j: -0.01780992, k: 6.519748e-05, l: -1.095593e-23}
  equation: log_atb <- log(atb); x4 <- b + c * log_atb + d * log_atb^2 + e * log_atb^5 + f * log_atb^10 + g * log(atb)^30; x5 <- h + i * log_atb + j * log_atb^3 + k * log_atb^5 + l * log_atb^30; a - exp(x4) * exp(x5) + exp(x4) * (hst - 4.5)
  taxa:
  - {family: Pinaceae, genus: Picea, species: sitchensis}
- name: hstix50_2
  type: fixed_effects
  response: {hstix50: ft}
  covariates: {hst: ft, atb: years}
  parameters: {a: 87.7, b: -0.5004715, c: 1.082291, d: -0.2673998, e: 8.355966e-06, f: -7.751521e-09, g: 7.142552e-27, h: 0.3621734, i: 1.149181, j: -0.005617852, k: -7.267547e-06, l: 1.708195e-16, m: -2.482794e-22}
  equation: log_atb <- log(atb); x1 <- b + c * log_atb + d * log_atb^2 + e * log_atb^8 + f * log_atb^12 + g * log(atb)^36; x2 <- h + i * log_atb + j * log_atb^3 + k * log_atb^7 + l * log_atb^22 + m * log_atb^30; a - exp(x1) * exp(x2) + exp(x1) * (hst - 4.5)
  taxa:
  - {family: Pinaceae, genus: Tsuga, species: heterophylla}
