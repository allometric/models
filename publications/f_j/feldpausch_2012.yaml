publication:
  key: feldpausch_2012
  bibtype: article
  title: Tree height integrated into pantropical forest biomass estimates
  author: 'Feldpausch, Ted R and Lloyd, Jon and Lewis, Simon L and Brienen, Roel JW and Gloor, Manuel and Monteagudo Mendoza, Abel and Lopez-Gonzalez, Gabriela and Banin, Lindsay and Abu Salim, Kamariah and Affum-Baffoe, Kofi and others, '
  year: 2012
models:
- name: hst
  type: fixed_effects_set
  response: {hst: m}
  covariates: {dsob: cm}
  prediction_function: a * (1 - exp(-b * dsob^c))
  specifications:
  - {parameters: {a: 50.45, b: 0.0471, c: 0.812}, descriptors: {continent: Africa, geographic_region: C. Africa, country: [CM, GA]}}
  - {parameters: {a: 43.97, b: 0.0334, c: 0.8546}, descriptors: {continent: Africa, geographic_region: E. Africa, country: TZ}}
  - {parameters: {a: 53.13, b: 0.0331, c: 0.8329}, descriptors: {continent: Africa, geographic_region: W. Africa, country: [GH, LB]}}
  - {parameters: {a: 57.122, b: 0.0332, c: 0.8468}, descriptors: {continent: Asia, geographic_region: S.E. Asia, country: [BN, MY]}}
  - {parameters: {a: 41.721, b: 0.0529, c: 0.7755}, descriptors: {continent: Australia, geographic_region: N. Australia, country: AU}}
  - {parameters: {a: 227.35, b: 0.0139, c: 0.555}, descriptors: {continent: S. America, geographic_region: Brazilian Shield, country: [BO, BR]}}
  - {parameters: {a: 48.131, b: 0.0375, c: 0.8228}, descriptors: {continent: S. America, geographic_region: E.C. Amazonia, country: BR}}
  - {parameters: {a: 46.263, b: 0.0876, c: 0.6072}, descriptors: {continent: S. America, geographic_region: W. Amazonia, country: [CO, EC, PE]}}
  - {parameters: {a: 50.096, b: 0.03711, c: 0.8291}, descriptors: {continent: Africa, country: [CM, GA, TZ, GH, LB]}}
  - {parameters: {a: 42.574, b: 0.0482, c: 0.8307}, descriptors: {continent: S. America, country: [BO, BR, BR, CO, EC, PE]}}
  - {parameters: {a: 50.874, b: 0.042, c: 0.784}, descriptors: {country: [CM, GA, TZ, GH, LB, BO, BR, CO, EC, PE, BN, MY, AU]}}
- name: bt
  type: fixed_effects
  response: {bt: kg}
  covariates: {dsob: cm, rws: g cm-3}
  parameters: {a: -1.8222, b: 2.337, c: 0.1632, d: -0.0248, e: 0.9792, rse: 0.3595}
  descriptors: {geographic_region: pantropical}
  prediction_function: cf <- exp(rse^2/2); cf * exp(a + b * log(dsob) + c * log(dsob)^2 + d * log(dsob)^3 + e * log(rws))
- name: bt_2
  type: fixed_effects
  response: {bt: kg}
  covariates: {dsob: cm, rws: g cm-3, hst: m}
  parameters: {a: -2.9205, b: 0.9894, rse: 0.3222}
  descriptors: {geographic_region: pantropical}
  prediction_function: cf <- exp(rse^2/2); cf * exp(a + b * log(dsob^2 * rws * hst))
