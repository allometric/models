publication:
  key: hann_1987
  bibtype: techreport
  title: Dominant-height-growth and site-index equations for Douglas-fir and ponderosa pine in southwest Oregon
  author: 'Hann, David W and Scrivani, John A and others, '
  year: 1987
models: []
model_sets:
- name: hstix50
  type: fixed_effects_set
  response: {hstix50: ft}
  covariates: {hst: ft, atb: yr}
  prediction_function: 4.5 + (hst - 4.5) * exp(b_1 * (atb - 50) + b_2 * (atb - 50)^2 + b_3 * (atb - 50) * log(hst - 4.5) + b_4 * (atb - 50)^2 * log(hst - 4.5))
  specifications:
  - {parameters: {b_1: -0.0521778, b_2: 0.000715141, b_3: 0.00797252, b_4: -0.000133377}, taxa: [{family: Pinaceae, genus: Pseudotsuga, species: menziesii}]}
  - {parameters: {b_1: -0.069934, b_2: 0.000359644, b_3: 0.0120483, b_4: -7.18058e-05}, taxa: [{family: Pinaceae, genus: Pinus, species: ponderosa}]}
