publication:
  key: iffsc_2022
  bibtype: techreport
  title: Modelos de biomassa para espécies arbóreas nativas de Santa Catarina
  author: 'IFFSC, '
  year: 2022
  descriptors:
    country: BR
    region: BR-SC
  institution: "Inventário Florístico Florestal de Santa Catarina"
models:
- name: bt
  type: fixed_effects
  response: {bt: kg}
  covariates: {dsob: cm, rws: g cm-3}
  parameters: {a: 0.05678, b: 31.1785, c: 30.0868, d: 0.9894}
  descriptors: {geographic_region: pantropical, forest_type: dense ombrophilous}
  prediction_function: a * (dsob^2 * (1.3 + ((b * dsob)/(c * dsob))) * rws)^d
- name: bt_2
  type: fixed_effects
  response: {bt: kg}
  covariates: {dsoc: cm, hst: m}
  parameters: {a: 295.6, b: 6.1366, c: -0.1161, d: -0.1522}
  taxa:
  - {family: Uritaceae, genus: Cecropia, species: galaziovii}
  prediction_function: a/(1 + exp(b + c * dsoc + d * hst))
- name: bt_4
  type: fixed_effects
  response: {bt: kg}
  covariates: {dsob: cm, rws: g cm-3}
  parameters: {a: 0.05678, b: 23.1311, c: -10.0152, d: 0.9894}
  taxa:
  - {family: Araucariaceae, genus: Araucaria, species: angustifolia}
  prediction_function: a * (dsob^2 * (1.3 + b * exp(c/dsob)) * rws)^d
- name: bt_5
  type: fixed_effects
  response: {bt: kg}
  covariates: {dsob: cm, rws: g cm-3}
  parameters: {a: 0.05678, b: 20.6603, c: 0.037056, d: 0.9894}
  descriptors: {forest_type: deciduous}
  prediction_function: a * (dsob^2 * (1.3 + b * (1 - exp(c * dsob))) * rws)^d
model_sets:
- name: bt_3
  type: fixed_effects_set
  response: {bt: kg}
  covariates: {dsob: cm, hst: m}
  prediction_function: a * dsob^b * hst^c
  specifications:
  - {parameters: {a: 0.1523, b: 1.1254, c: 1.0338}, taxa: [{family: Cyatheaceae, genus: Cyathea, species: delgadii}]}
  - {parameters: {a: 0.0175, b: 1.5288, c: 1.66}, taxa: [{family: Arecaceae, genus: Euterpe, species: edulist}]}
