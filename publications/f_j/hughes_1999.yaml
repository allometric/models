publication:
  key: hughes_1999
  bibtype: article
  title: Biomass, carbon, and nutrient dynamics of secondary forests in a humid tropical region of Mexico
  author: Hughes, R Flint and Kauffman, J Boone and Jaramillo, Victor J
  year: 1999
models:
- name: hst
  type: fixed_effects
  response: {hst: m}
  covariates: {dsob: cm}
  parameters: {a: 4.722, b: -13.323}
  descriptors: {dsob_limit: '> 10 cm'}
  prediction_function: a * log(dsob^2) + b
- name: bt
  type: fixed_effects
  response: {bt: kg}
  covariates: {dsob: cm}
  parameters: {a: 4.9375, b: 1.0583, cf: 1.14}
  descriptors: {dsob_limit: < 10 cm}
  prediction_function: (exp(a + b * log(dsob^2))) * cf/(10^6)
- name: bt_2
  type: fixed_effects
  response: {bt: kg}
  covariates: {dsob: cm, hst: m}
  parameters: {a: 3.6272, b: 0.5768, cf: 1.02}
  taxa:
  - {family: Arecaceae, genus: null, species: null}
  prediction_function: (exp(a + b * log(dsob^2 * hst))) * cf/(10^6)
