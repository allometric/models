publication:
  key: vibrans_2015
  bibtype: article
  title: Generic and specific stem volume models for three subtropical forest types in southern Brazil
  author: Vibrans, Alexander C and Moser, Paolo and Oliveira, Laio Z and de, João P
  year: 2015
models: []
model_sets:
- name: vsoa
  type: fixed_effects_set
  response: {vsoa: m3}
  covariates: {dsob: cm, hst: m}
  prediction_function: circ <- dsob * pi; 1000 * exp(beta_0 + beta_1 * log(circ^2) + beta_2 * log(hst))
  specifications:
  - {parameters: {beta_0: -17.72, beta_1: 0.95, beta_2: 0.69}, descriptors: {forest_type: seasonal deciduous}, taxa: [{family: Lauraceae, genus: Nectandra, species: megapotamica}]}
  - {parameters: {beta_0: -17.52, beta_1: 0.93, beta_2: 0.68}, descriptors: {forest_type: seasonal deciduous}, taxa: [{family: Lauraceae, genus: Ocotea, species: puberula}]}
