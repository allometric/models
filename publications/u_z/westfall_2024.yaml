  type: fixed_effects_set
  response: {vsia: ft3}
  covariates: {dsob: in, hst: ft}
  prediction_function: 'ifelse(dsob < k, a * dsob^b * hst^c, a * k^(b - b1) * dsob^b1 * hst^c)'
  response_definition: 'Total stem wood volume inside bark, groundline to tree tip (includes top and stump); D is diameter at breast height (4.5 ft) outside bark in inches and H is total tree height in feet.'
