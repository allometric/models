publication:
  key: krisnawati_2016
  bibtype: article
  title: A compatible estimation model of stem volume and taper for Acacia mangium Willd. plantations
  author: Krisnawati, Haruni
  year: 2016
  descriptors:
    country: ID
    region: ID-SS
  journal: "Indoensian Journal of Forestry Research"
  volume: 3
  number: 1
  pages: 49--64
  doi: "https://doi.org/10.20886/ijfr.2016.3.1.49-64"
models:
- name: vsoa
  type: fixed_effects
  taxa:
  - family: Fabaceae
    genus: Acacia
    species: mangium
  response: {vsoa: m3}
  covariates: {dsob: cm, hst: m}
  parameters: {a: 6.36e-05, b: 1.736, c: 1.0734}
  prediction_function: a * dsob^b * hst^c
- name: vsia
  type: fixed_effects
  taxa:
  - family: Fabaceae
    genus: Acacia
    species: mangium
  response: {vsia: m3}
  covariates: {dsob: cm, hst: m}
  parameters: {a: 5.42e-05, b: 1.0778, c: 1.04}
  prediction_function: a * dsob^b * hst^c
- name: dsoh
  type: fixed_effects
  taxa:
  - family: Fabaceae
    genus: Acacia
    species: mangium
  response: {dsoh: cm}
  covariates: {dsob: cm, hst: m, hsl: m}
  parameters: {a: 1.384, b: 0.8678, c: -0.6393, d: 0.676}
  prediction_function: a * dsob^b * hst^c * hsl^d
- name: dsih
  type: fixed_effects
  taxa:
  - family: Fabaceae
    genus: Acacia
    species: mangium
  response: {dsih: cm}
  covariates: {dsob: cm, hst: m, hsl: m}
  parameters: {a: 1.256, b: 0.889, c: -0.6213, d: 0.643}
  descriptors: {volume_type: merchantable volume outside bark to specified height}
  prediction_function: a * dsob^b * hst^c * hsl^d
- name: vsim
  type: fixed_effects
  taxa:
  - family: Fabaceae
    genus: Acacia
    species: mangium
  response: {vsim: m3}
  covariates: {dsob: cm, hst: m, dsih: cm}
  parameters: {a: 5.42e-05, b: 1.778, c: -1.2426, d: 2.286, e: 0.445, f: 3.555, g: -3.161, h: 2.209}
  descriptors: {volume_type: merchantable volume inside bark to specified height}
  prediction_function: a * dsob^b * hst^c * (hst^d - (e * dsih^f * dsob^g * hst^h))
- name: vsom
  type: fixed_effects
  taxa:
  - family: Fabaceae
    genus: Acacia
    species: mangium
  response: {vsom: m3}
  covariates: {dsob: cm, hst: m, dsoh: cm}
  parameters: {a: 6.36e-05, b: 1.736, c: -1.2786, d: 2.352, e: 0.326, f: 3.479, g: -3.019, h: 2.224}
  prediction_function: a * dsob^b * hst^c * (hst^d - (e * dsoh^f * dsob^g * hst^h))
