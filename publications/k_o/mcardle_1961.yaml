publication:
  key: mcardle_1961
  bibtype: techreport
  title: The Yield of Douglas-fir in the Pacific Northwest
  author: McArdle, Richard E and Meyer, Walter H and Bruce, Donald
  year: 1961
  descriptors:
    country: US
    region: [US-OR, US-WA]
  volume: 201
  institution: "United States Department of Agriculture"
models: []
model_sets:
- name: hstix50
  type: fixed_effects_set
  taxa:
  - family: Pinaceae
    genus: Pseudotsuga
    species: menziesii
  response: {hstix50: ft}
  covariates: {hst: ft, atb: years}
  prediction_function: exp(a + (b * log(atb))) * (c * hst + d)
  specifications:
  - {parameters: {a: 3.3, b: -0.8, c: 0.96, d: -2.66}, descriptors: {age_class: < 40}}
  - {parameters: {a: 2.1, b: -0.47, c: 0.96, d: -2.66}, descriptors: {age_class: '>= 40'}}
